<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Google Sheet - LabSaver</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1f2937;
      margin-top: 0;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
    }
    button {
      background: #1f2937;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover {
      background: #374151;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    #status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    #status.info {
      background: #dbeafe;
      color: #1e40af;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Select Your LabSaver Spreadsheet</h1>
    <p>Please select the Google Sheet where you'd like to save your lab results.</p>
    <p>You can choose an existing spreadsheet or create a new one.</p>
    <button id="authorize_button">Select Spreadsheet</button>
    <div id="status"></div>
    <div id="file-list" style="margin-top: 20px; display: none;">
      <h3 style="color: #1f2937; margin-bottom: 10px;">Your Google Sheets:</h3>
      <div id="files" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
